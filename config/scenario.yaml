# Scenario della demo. Tutti i valori modificabili stanno qui.
# Lo stato di ogni numero (validato / da validare) è in docs/ipotesi.md.

area:
  nome: "Prati-Trastevere"
  # lon_min, lat_min, lon_max, lat_max (WGS84)
  riquadro: [12.455, 41.880, 12.480, 41.912]

giorno:
  data: "2024-10-03"        # giovedì, giorno di scuola; pioggia >4 mm/h alle 16 e alle 17 (Open-Meteo)
  inizio: "06:00"           # la centrale segue i veicoli dall'inizio del servizio a mezzanotte
  fine: "24:00"
  fascia_min: 5

traffico:                   # velocità media del traffico a Roma (TomTom Traffic Index): i veicoli vanno a questa, fino al loro massimo
  punta_kmh: 16.7           # media nelle ore di punta
  punta_fasce: [["07:00", "10:00"], ["17:00", "20:00"]]
  giorno_kmh: 19.5          # 10 km in 30 min 46 s, media dell'anno
  sera_kmh: 30.0            # dalle 21: traffico libero, ogni veicolo va al suo massimo
  sera_da: "21:00"

flotte:                     # la centrale condivisa: 150 veicoli di 4 gestori diversi
  boxi:
    nome: "Poste · BOXi"
    tipo: consegne
    veicoli: 50
    velocita_max_kmh: 25    # scheda BOXi
    fermate_per_giro: 8
    sosta_fermata_s: 90
    ondate: ["08:30", "12:00", "16:00"]             # 3 giri: restano sotto i 60 km di autonomia (scheda BOXi)
    deposito: [41.90719, 12.46561]                  # ufficio postale Roma 5, Prati
    sfasabile: true
  corriere_a:
    nome: "Corriere A · furgoni"
    tipo: consegne
    veicoli: 40
    velocita_max_kmh: 50    # limite urbano
    fermate_per_giro: 12
    sosta_fermata_s: 150
    ondate: ["08:00", "12:30", "16:30"]
    deposito: [41.88360, 12.47460]                  # Porta Portese
    sfasabile: true
  corriere_b:
    nome: "Corriere B · furgoni"
    tipo: consegne
    veicoli: 30
    velocita_max_kmh: 50
    fermate_per_giro: 12
    sosta_fermata_s: 150
    ondate: ["09:00", "13:30", "17:00"]
    deposito: [41.90600, 12.45750]                  # Borgo, verso Porta Cavalleggeri
    sfasabile: true
  navette:
    nome: "Navette di linea"
    tipo: linea
    veicoli: 30
    velocita_max_kmh: 25    # navette autonome di linea
    sosta_fermata_s: 20
    fermata_ogni_m: 400
    servizio: ["06:30", "23:30"]
    sfasabile: false        # orario di linea: non si sposta
    linee:                  # capolinea e punti di passaggio (lat, lon); ogni linea fa avanti e indietro
      - [[41.90670, 12.45930], [41.90660, 12.46430], [41.90460, 12.47050]]   # Risorgimento – Cola di Rienzo – Cavour
      - [[41.90170, 12.46270], [41.89250, 12.47200], [41.88930, 12.47350]]   # Piazza Pia – Lungotevere – Sonnino
      - [[41.89250, 12.46720], [41.88690, 12.46920], [41.88360, 12.47460]]   # Porta Settimiana – San Cosimato – Porta Portese

operatori:
  durata_media_intervento_s: 35   # ricavata da Cruise: una sessione ogni 4–5 miglia, 2–4% del tempo, 14 mph medie a San Francisco
  attesa_max_s: 20
  livello_servizio: 0.90
  blocco_turno_min: 60      # con la previsione gli operatori in turno cambiano al massimo una volta l'ora
  turni: [["06:00", "14:00"], ["14:00", "22:00"], ["22:00", "24:00"]]   # turni fissi di una centrale senza previsione
  prudenza_min: 60          # piano prudente senza meteo: ogni picco si copre da un'ora prima a un'ora dopo (con il meteo si rifà il piano con il temporale anticipato e ritardato di un'ora)

tempo_reale:                # leve in tempo reale sopra il piano (tutte con preavvisi realistici)
  orizzonte_min: 15                    # carico atteso nei prossimi 15 minuti (strade che i veicoli stanno per fare)
  preavviso_meteo_min: 120             # aggiornamento meteo e radar: le condizioni vere sono note 2 ore prima
  quota_misti: 0.25                    # leva 1: un quarto degli operatori in turno fa back-office...
  passaggio_misti_min: 1               # ...e passa alla supervisione in 1 minuto
  prolungamento_max_min: 60            # leva 2: chi finisce il turno può restare fino a un'ora in più,
  prolungamento_preavviso_min: 30      # deciso con almeno 30 minuti di preavviso,
  maggiorazione_straordinario: 0.25    # pagato il 25% in più
  reperibili_per_turno: 2              # leva 3: persone in reperibilità per ogni turno fisso,
  reperibilita_preavviso_min: 45       # operative 45 minuti dopo la chiamata,
  reperibilita_durata_min_min: 120     # per almeno 2 ore;
  indennita_reperibilita_quota: 0.15   # indennità per ogni ora di reperibilità, come quota del costo orario (stima)
  ritardo_partenze_max_min: 10         # leva 4: partenze delle consegne ritardate al massimo di 10 minuti
  sosta_max_min: 10                    # e soste prima delle vie più a rischio al massimo di 10 minuti a veicolo
  quota_vie_rischio: 0.05              # "vie più a rischio" = il 5% dei tratti con la probabilità più alta in quella fascia

attenzione:
  orizzonte_min: 3              # quanto avanti guarda il livello di ogni veicolo
  soglia_osservazione: 0.15     # P(richiesta nei prossimi 3 min) sopra cui il veicolo diventa giallo (score sotto 85); scelta con tools/soglie.py
  soglia_intervento: 0.35       # ... e rosso (score sotto 65): da guardare per primo, prima che si fermi
  anticipo_validazione_min: 2   # per misurare le soglie: stato del veicolo 2 minuti prima di ogni richiesta

ottimizzazione:
  spostamento_max_min: 10     # di quanto si può anticipare o ritardare una partenza
  passo_min: 1

rigioco:
  seme: 42                    # stesso seme per "senza" e "con"
  giornate_pianificazione: 20 # il piano dei turni si prova su 20 giornate simulate dalla previsione, mai su quella del rigioco
  quota_giornate: 0.95        # ogni ora deve rispettare il servizio in almeno il 95% delle giornate simulate
  operatori_senza_sistema: 3  # pannello animato: operatori fissi senza previsione (il confronto del pitch è a parità di servizio)

console:                        # l'operatore in console (server/diretta.py)
  postazione: 3                 # la postazione di chi usa la console: le richieste che il motore le assegna aspettano lui
  passa_a_collega_dopo_s: 60    # se non le prende entro questo tempo, le prende un collega (scelta)
  fermo_assistenza_min: 10      # "assistenza in strada": il veicolo resta fermo finché arriva qualcuno (stima)
  fermo_arresto_min: 15         # "arresto": il veicolo resta fermo, poi riparte dopo il controllo (stima)
  cause:                        # cause tra cui l'operatore sceglie alla chiusura dell'intervento
    - Pedoni in attraversamento
    - Doppia fila o ostacolo
    - Uscita scuola o folla
    - Pioggia o visibilità
    - GPS o sensori
    - Altro

copilota:                       # copilota AI nella scheda intervento (server/copilota.py); chiave ANTHROPIC_API_KEY in .env
  modello: claude-opus-5-5
  effort: low                   # risposta in pochi secondi: deve stare dentro i 20 s dell'intervento
  attesa_max_s: 8               # oltre questo tempo si usa il ripiego costruito dai dati del motore
